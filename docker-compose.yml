services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulsepay
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  api:
    build:
      context: ./api
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pulsepay?schema=public
      - RABBITMQ_URL=amqp://rabbitmq
      - RABBITMQ_QUEUE=transferencias
      - JWT_SECRET=dev-secret
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - rabbitmq

  worker:
    build:
      context: ./worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pulsepay?schema=public
      - RABBITMQ_URL=amqp://rabbitmq
      - RABBITMQ_QUEUE=transferencias
    depends_on:
      - postgres
      - rabbitmq

volumes:
  db-data:
version: "3.9"

networks:
  pulsepay-net:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  grafana-data:
  prometheus-data:

services:
  postgres:
    image: postgres:16
    container_name: pulsepay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pulsepay-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pulsepay-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pulsepay-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepay-api
    restart: unless-stopped
    command: ["node", "src/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    ports:
      - "${API_PORT}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pulsepay-net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsepay-worker
    restart: unless-stopped
    command: ["node", "worker/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      WORKER_METRICS_PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - pulsepay-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: pulsepay-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api
    networks:
      - pulsepay-net

  prometheus:
    image: prom/prometheus:latest
    container_name: pulsepay-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      - api
      - worker
    networks:
      - pulsepay-net

  grafana:
    image: grafana/grafana:latest
    container_name: pulsepay-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - pulsepay-net
