name: PulsePay CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-backend:
    name: Lint + Testes (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar testes (Jest/Supertest)
        working-directory: backend
        run: npm test

  build-images:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem da API/Worker
        run: docker build -t pulsepay-backend:ci ./backend

      - name: Build imagem do Frontend
        run: docker build -t pulsepay-frontend:ci ./frontend

  # Entrega 4 (README seção 3): sobe a stack REAL via Docker Compose e roda,
  # contra ela, os testes que dependem de infraestrutura de verdade —
  # fluxo assíncrono, concorrência/race condition, imutabilidade da
  # auditoria — e o teste de carga com k6 que valida o SLA (seção 6).
  teste-integracao-e-carga:
    name: Testes de Integração + Carga (k6) - Entrega 4
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env
        run: cp .env.example .env

      - name: Subir stack completa (Docker Compose)
        run: docker compose up -d --build postgres rabbitmq api worker

      - name: Aguardar API ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API disponível."
              exit 0
            fi
            echo "Aguardando API... ($i/30)"
            sleep 2
          done
          echo "API não ficou saudável a tempo."
          docker compose logs
          exit 1

      - name: Aplicar migrações do Prisma
        run: docker compose exec -T api npx prisma migrate deploy

      - name: Aplicar trigger de imutabilidade da auditoria
        # Só pode ser criada DEPOIS que "prisma migrate deploy" cria a
        # tabela "Auditoria" - por isso não pode ficar só no
        # docker-entrypoint-initdb.d (que roda antes da tabela existir).
        # Ver também run.txt seção 2, passo 5.
        run: docker compose exec -T postgres psql -U pulsepay -d pulsepay -f /docker-entrypoint-initdb.d/01-audit-trigger.sql

      - name: Rodar testes de integração (fluxo assíncrono, concorrência, imutabilidade)
        run: docker compose exec -T api npm run test:integracao

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Rodar teste de carga (k6) - valida SLA da seção 6 do README
        id: k6
        # continue-on-error: um teste de carga real pode revelar que o
        # ambiente/hardware atual não sustenta a meta de SLA sob pico -
        # isso é um RESULTADO válido (README seção 7: "SLA simulado não
        # bater com o real"), não deve travar o pipeline. O resumo fica
        # nos logs para embasar os "ajustes finais de performance" da
        # Entrega 4.
        continue-on-error: true
        env:
          API_URL: http://localhost:4000
        run: k6 run backend/scripts/load-test.k6.js

      - name: Encerrar stack
        if: always()
        run: docker compose down -v

  # Deploy real fora do escopo acadêmico (README seção "Fora do escopo").
  # Job abaixo documenta como seria o CD via Docker Compose em um
  # ambiente de homologação com acesso SSH configurado nos secrets do repo.
  deploy:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    needs: teste-integracao-e-carga
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Placeholder de deploy
        run: |
          echo "Etapa de CD: em um ambiente real, aqui rodaria"
          echo "docker compose pull && docker compose up -d --build"
          echo "via SSH no servidor de homologação (fora do escopo deste projeto acadêmico)."
