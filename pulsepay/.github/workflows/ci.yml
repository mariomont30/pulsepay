name: PulsePay CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-backend:
    name: Lint + Testes (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar testes (Jest/Supertest)
        working-directory: backend
        run: npm test

  build-images:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build imagem da API/Worker
        run: docker build -t pulsepay-backend:ci ./backend

      - name: Build imagem do Frontend
        run: docker build -t pulsepay-frontend:ci ./frontend

  # Deploy real fora do escopo acadêmico (README seção "Fora do escopo").
  # Job abaixo documenta como seria o CD via Docker Compose em um
  # ambiente de homologação com acesso SSH configurado nos secrets do repo.
  deploy:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Placeholder de deploy
        run: |
          echo "Etapa de CD: em um ambiente real, aqui rodaria"
          echo "docker compose pull && docker compose up -d --build"
          echo "via SSH no servidor de homologação (fora do escopo deste projeto acadêmico)."
